apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: merchant-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: merchant-payments-african-merchant-api
      name: http
      visibility: project
      envBindings:
        address: MERCHANT_API_URL
  resources:
    - ref: merchant-payments-cb1b22c6
      envBindings:
        client_id: MERCHANT_AUTH_CLIENT_ID
        issuer: MERCHANT_AUTH_ISSUER
        jwks_url: MERCHANT_AUTH_JWKS_URL
        resource: MERCHANT_AUTH_RESOURCE
        scopes: MERCHANT_AUTH_SCOPES
