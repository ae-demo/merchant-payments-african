openapi: 3.0.3
info:
  title: Merchant API
  version: 0.1.0
  description: Merchants, payment requests, transactions and payouts for the merchant payments platform.
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            payment-requests:create: Create a payment request
            payment-requests:read: The caller's own payment requests
            transactions:read: The caller's own transactions
            payouts:request: Request a payout
            payouts:read: The caller's own payouts
security:
  - oauth2: []
paths:
  /me/merchant:
    get:
      operationId: getMyMerchant
      summary: The caller's merchant profile
      responses:
        '200':
          description: The merchant profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createMyMerchant
      summary: Register the caller's merchant profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantInput' }
      responses:
        '201':
          description: Merchant profile created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/payment-requests:
    get:
      operationId: listMyPaymentRequests
      summary: The caller's payment requests
      security:
        - oauth2: [payment-requests:read]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, paid, expired] } }
      responses:
        '200':
          description: A page of the caller's payment requests
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentRequest' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createPaymentRequest
      summary: Create a payment request
      security:
        - oauth2: [payment-requests:create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRequestInput' }
      responses:
        '201':
          description: The created payment request, with its shareable link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRequest' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Missing required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/payment-requests/{paymentRequestId}:
    get:
      operationId: getMyPaymentRequest
      summary: One of the caller's payment requests
      security:
        - oauth2: [payment-requests:read]
      parameters:
        - { name: paymentRequestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The payment request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRequest' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/transactions:
    get:
      operationId: listMyTransactions
      summary: The caller's transactions
      security:
        - oauth2: [transactions:read]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, successful, failed] } }
      responses:
        '200':
          description: A page of the caller's transactions
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/balance:
    get:
      operationId: getMyBalance
      summary: The caller's available balance
      security:
        - oauth2: [transactions:read]
      responses:
        '200':
          description: The available balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/payouts:
    get:
      operationId: listMyPayouts
      summary: The caller's payout requests
      security:
        - oauth2: [payouts:read]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of the caller's payouts
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Payout' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: requestPayout
      summary: Request a payout of the caller's available balance
      security:
        - oauth2: [payouts:request]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutInput' }
      responses:
        '201':
          description: The created payout request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '400':
          description: Invalid input or insufficient balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /payment-links/{paymentRequestId}:
    get:
      operationId: getPaymentLink
      summary: A payment request, for the paying customer
      security: []
      parameters:
        - { name: paymentRequestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The amount, currency and merchant name for this payment request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentLink' }
        '404':
          description: Not found or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /payment-links/{paymentRequestId}/pay:
    post:
      operationId: payPaymentLink
      summary: Pay a payment request as a guest, via mobile money or card
      security: []
      parameters:
        - { name: paymentRequestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '200':
          description: The resulting transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400':
          description: Invalid payment details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Merchant:
      type: object
      required: [id, businessName, email, phone, country, currency]
      properties:
        id: { type: string }
        businessName: { type: string }
        email: { type: string }
        phone: { type: string }
        country: { type: string, description: ISO country code }
        currency: { type: string, description: derived from country }
        createdAt: { type: string, format: date-time }
    MerchantInput:
      type: object
      required: [businessName, email, phone, country]
      properties:
        businessName: { type: string }
        email: { type: string }
        phone: { type: string }
        country: { type: string }
    PaymentRequest:
      type: object
      required: [id, amount, currency, status, createdAt]
      properties:
        id: { type: string }
        amount: { type: number, format: decimal }
        currency: { type: string }
        description: { type: string }
        status: { type: string, enum: [pending, paid, expired] }
        paymentLinkUrl: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
    PaymentRequestInput:
      type: object
      required: [amount]
      properties:
        amount: { type: number, format: decimal }
        description: { type: string }
    Transaction:
      type: object
      required: [id, paymentRequestId, amount, currency, method, status, createdAt]
      properties:
        id: { type: string }
        paymentRequestId: { type: string }
        amount: { type: number, format: decimal }
        currency: { type: string }
        method: { type: string, enum: [mobile_money, card] }
        status: { type: string, enum: [pending, successful, failed] }
        gatewayReference: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Balance:
      type: object
      required: [available, currency]
      properties:
        available: { type: number, format: decimal }
        currency: { type: string }
    Payout:
      type: object
      required: [id, amount, currency, destinationType, status, requestedAt]
      properties:
        id: { type: string }
        amount: { type: number, format: decimal }
        currency: { type: string }
        destinationType: { type: string, enum: [bank, mobile_wallet] }
        destinationDetails: { type: string }
        status: { type: string, enum: [pending, processing, completed, failed] }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    PayoutInput:
      type: object
      required: [amount, destinationType, destinationDetails]
      properties:
        amount: { type: number, format: decimal }
        destinationType: { type: string, enum: [bank, mobile_wallet] }
        destinationDetails: { type: string }
    PaymentLink:
      type: object
      required: [paymentRequestId, businessName, amount, currency, status]
      properties:
        paymentRequestId: { type: string }
        businessName: { type: string }
        amount: { type: number, format: decimal }
        currency: { type: string }
        status: { type: string, enum: [pending, paid, expired] }
    PaymentInput:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [mobile_money, card] }
        mobileMoneyNumber: { type: string }
        cardNumber: { type: string }
        cardExpiry: { type: string }
        cardCvv: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
